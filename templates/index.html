<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ViewAssistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }

    header {
      background: #1a1a2e; color: white;
      padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
    header span { font-size: 12px; color: #8892b0; }

    main { max-width: 860px; margin: 32px auto; padding: 0 24px 60px; }

    .card {
      background: white; border-radius: 12px;
      padding: 24px; margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .card h2 {
      font-size: 14px; font-weight: 600; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 18px; padding-bottom: 12px;
      border-bottom: 1px solid #f3f4f6;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label { font-size: 13px; font-weight: 500; color: #374151; }
    .hint { font-size: 11px; color: #9ca3af; margin-top: 2px; }

    select {
      border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 9px 12px; font-size: 14px; color: #1f2937;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit; width: 100%; background: white; cursor: pointer;
    }
    select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    input, textarea {
      border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 9px 12px; font-size: 14px; color: #1f2937;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit; width: 100%;
    }
    input:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    textarea { resize: vertical; min-height: 130px; line-height: 1.6; }

    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 38px; }
    .eye-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #9ca3af;
      font-size: 15px; line-height: 1; padding: 2px;
    }
    .eye-btn:hover { color: #6b7280; }
    .folder-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 17px; line-height: 1; padding: 2px; opacity: 0.6;
    }
    .folder-btn:hover { opacity: 1; }
    .folder-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 10px 22px; border-radius: 8px; font-size: 14px;
      font-weight: 500; cursor: pointer; border: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-run { background: #10b981; color: white; }
    .btn-run:hover:not(:disabled) { background: #059669; }

    .toast {
      display: none; padding: 8px 14px; border-radius: 7px;
      font-size: 13px; font-weight: 500;
    }
    .toast.show { display: inline-block; }
    .toast.ok { background: #d1fae5; color: #065f46; }
    .toast.err { background: #fee2e2; color: #991b1b; }

    .log-box {
      background: #1e1e2e; border-radius: 8px; padding: 16px;
      min-height: 160px; max-height: 400px; overflow-y: auto;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-size: 13px; line-height: 1.7; color: #cdd6f4;
    }
    .log-box .line-info   { color: #89dceb; }
    .log-box .line-ok     { color: #a6e3a1; }
    .log-box .line-err    { color: #f38ba8; }
    .log-box .line-plain  { color: #cdd6f4; }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; gap: 4px; }
    }
  </style>
</head>
<body>

<header>
  <h1>ViewAssistant</h1>
  <span>AI 前沿资讯周报 · 配置中心</span>
</header>

<main>

  <div class="card">
    <h2>邮箱配置</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>邮箱地址</label>
        <input type="text" id="email" placeholder="123456@qq.com" />
      </div>
      <div class="form-group">
        <label>IMAP 服务器</label>
        <input type="text" id="imap_host" placeholder="imap.qq.com" />
      </div>
      <div class="form-group">
        <label>发件人过滤</label>
        <input type="text" id="sender_filter" placeholder="hello@agidaily.cc" />
        <span class="hint">只抓取该发件人的邮件，留空则不过滤</span>
      </div>
      <div class="form-group">
        <label>主题关键词</label>
        <input type="text" id="subject_keyword" placeholder="AI" />
        <span class="hint">按主题关键词过滤，留空则不过滤</span>
      </div>
      <div class="form-group full">
        <label>周报发送至（收件人邮箱）</label>
        <input type="text" id="notify_email" placeholder="留空则不发送邮件" />
        <span class="hint">生成后自动通过 QQ 邮箱发送，可填写任意邮箱地址</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>密钥配置</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>QQ 邮箱授权码</label>
        <div class="input-wrap">
          <input type="password" id="email_password" placeholder="16 位授权码" />
          <button class="eye-btn" onclick="togglePwd('email_password')">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label>DeepSeek API Key</label>
        <div class="input-wrap">
          <input type="password" id="deepseek_api_key" placeholder="sk-..." />
          <button class="eye-btn" onclick="togglePwd('deepseek_api_key')">👁</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>执行计划</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>执行日期</label>
        <select id="schedule_day">
          <option value="1">周一</option>
          <option value="2">周二</option>
          <option value="3">周三</option>
          <option value="4">周四</option>
          <option value="5">周五</option>
          <option value="6">周六</option>
          <option value="0">周日</option>
        </select>
      </div>
      <div class="form-group">
        <label>执行时间</label>
        <input type="time" id="schedule_time" />
        <span class="hint">保存后 crontab 自动更新（macOS / Linux）</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>输出配置</h2>
    <div class="form-group">
      <label>周报保存目录</label>
      <div class="input-wrap">
        <input type="text" id="output_dir" placeholder="/Users/xxx/Documents/AI_Reports" style="padding-right: 38px;" />
        <button class="folder-btn" id="btn-pick-folder" onclick="pickFolder()" title="浏览文件夹">📁</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Prompt 配置</h2>
    <div class="form-group">
      <label>生成周报的提示词</label>
      <textarea id="prompt"></textarea>
    </div>
  </div>

  <div class="card">
    <div class="actions">
      <button class="btn btn-primary" id="btn-save" onclick="saveConfig()">保存配置</button>
      <button class="btn btn-run"     id="btn-run"  onclick="runReport()">立即生成周报</button>
      <span class="toast" id="toast"></span>
    </div>
  </div>

  <div class="card">
    <h2>运行日志</h2>
    <div class="log-box" id="log-box"><span class="line-plain">等待运行...</span></div>
  </div>

</main>

<script>
  const fields = ['email','imap_host','sender_filter','subject_keyword','notify_email','output_dir','prompt','schedule_day','schedule_time','email_password','deepseek_api_key'];

  async function loadConfig() {
    try {
      const res = await fetch('/api/config');
      const cfg = await res.json();
      fields.forEach(k => {
        const el = document.getElementById(k);
        if (el) el.value = cfg[k] ?? '';
      });
    } catch(e) {
      showToast('配置加载失败', 'err');
    }
  }

  async function saveConfig() {
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    const body = {};
    fields.forEach(k => body[k] = document.getElementById(k).value);
    body.schedule_day = parseInt(body.schedule_day);
    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      showToast(res.ok ? '配置已保存 ✓' : '保存失败', res.ok ? 'ok' : 'err');
    } catch(e) {
      showToast('保存失败', 'err');
    }
    btn.disabled = false;
  }

  async function runReport() {
    const btn = document.getElementById('btn-run');
    btn.disabled = true;
    const logBox = document.getElementById('log-box');
    logBox.innerHTML = '';

    try {
      const res = await fetch('/api/run', { method: 'POST' });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const text = decoder.decode(value);
        text.split('\n').filter(l => l.startsWith('data: ')).forEach(line => {
          const msg = line.slice(6);
          if (msg === '[DONE]') return;
          const div = document.createElement('div');
          div.textContent = msg;
          if (msg.includes('✅'))      div.className = 'line-ok';
          else if (msg.includes('❌') || msg.toLowerCase().includes('error') || msg.includes('失败'))
                                        div.className = 'line-err';
          else if (msg.includes('正在') || msg.includes('找到'))
                                        div.className = 'line-info';
          else                          div.className = 'line-plain';
          logBox.appendChild(div);
          logBox.scrollTop = logBox.scrollHeight;
        });
      }
    } catch(e) {
      const div = document.createElement('div');
      div.className = 'line-err';
      div.textContent = '连接服务器失败';
      logBox.appendChild(div);
    }
    btn.disabled = false;
  }

  async function pickFolder() {
    const btn = document.getElementById('btn-pick-folder');
    btn.disabled = true;
    try {
      const res = await fetch('/api/pick-folder');
      const data = await res.json();
      if (data.path) {
        document.getElementById('output_dir').value = data.path;
      } else {
        showToast('未选择文件夹', 'err');
      }
    } catch(e) {
      showToast('无法打开文件夹选择器', 'err');
    }
    btn.disabled = false;
  }

  function togglePwd(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${type}`;
    setTimeout(() => t.className = 'toast', 2500);
  }

  loadConfig();
</script>
</body>
</html>
